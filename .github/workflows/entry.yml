name: Process expense entry

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    outputs:
      isValid: ${{ steps.process.outputs.isValid }}
      message: ${{ steps.process.outputs.message }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: process
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx scripts/process-issue.mjs
      - if: steps.process.outputs.isValid == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries
          git commit -m "feat: add expense from issue #${{ github.event.issue.number }}"
          git push
      - uses: actions/github-script@v7
        env:
          RESULT_MESSAGE: ${{ steps.process.outputs.message }}
        with:
          script: |
            const isValid = '${{ steps.process.outputs.isValid }}' === 'true'
            const prefix = isValid ? '✅ ' : '⚠️ '
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${prefix}${process.env.RESULT_MESSAGE}`,
            })
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: isValid ? 'completed' : 'not_planned',
            })
  deploy:
    needs: validate-and-commit
    if: needs.validate-and-commit.outputs.isValid == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
